services:
  db:
    image: postgres:16-alpine
    container_name: arreglaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arreglaya
    ports:
      - '5433:5432'
    volumes:
      - arreglaya-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d arreglaya']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  arreglaya-postgres-data:
